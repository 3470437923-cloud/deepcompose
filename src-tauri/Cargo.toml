[package]
name = "deepcompose"
version = "1.1.0"
description = "DeepCompose — 长篇中文小说 AI 写作工作台"
authors = ["DeepCompose"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "deepcompose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false }
futures-util = "0.3"
# 中文 Windows 用户的存量旧稿多为 GBK/GB18030：fs_read_text 的 UTF-8 失败回退靠它解码
encoding_rs = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
