<!DOCTYPE html>

<head>

<style>
/* ============================================================
   OpenWrite 界面复刻（纯 HTML + CSS，静态展示，按钮可点击无功能）
   画布：1920 × 1032（与原图 1:1 像素对应）
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#7C6AFF;
  --accent-2:#624DFF;
  --accent-soft:#211E3A;
  --bg-window:#0A0A0F;
  --bg-bar:#0E0E16;
  --bg-panel:#12121A;
  --bg-rail:#1A1A25;
  --bg-card:#171626;
  --line:#22222E;
  --line-soft:#1C1C26;
  --tx-1:#E8E8F0;
  --tx-2:#9898B0;
  --tx-3:#6E6E85;
  --radius:10px;
}
html,body{background:#050508}
body{
  font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  color:var(--tx-1);
  padding:24px 24px 72px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus{outline:none}
svg{display:block}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic-14{width:14px;height:14px}
.ic-18{width:18px;height:18px}
.ic-20{width:20px;height:20px}
.ic-fill{fill:currentColor;stroke:none}

/* ---------- 缩放容器 ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:28px}
.fitter{width:1920px;transform-origin:top left}
.holder{position:relative}
.win-frame{border:1px solid #1E1E28;border-radius:8px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.7)}

}

}

}

  text-align:center;padding:0 3px;box-shadow:0 0 0 2px var(--bg-bar);
}
.spacer{width:8px}

      <div class="win-frame">

  <button data-t="b">界面 B · 主界面</button>

</div>

<script>
// 纯展示：仅处理两屏切换与按钮"按下"的视觉反馈
function fit(){
  var scale = Math.min(1, (window.innerWidth - 80) / 1920);
  document.querySelectorAll('.fitter').forEach(function(el){
    el.style.transform = 'scale(' + scale + ')';
    el.parentElement.style.height = (1032 * scale) + 'px';
    el.parentElement.style.width  = (1920 * scale) + 'px';
  });
}
function syncSwitch(){
  var v = document.body.dataset.view;
  document.querySelectorAll('.switcher button').forEach(function(b){
    b.classList.toggle('on', b.dataset.t === v);
  });
  fit();
}
document.querySelectorAll('.switcher button').forEach(function(b){
  b.addEventListener('click', function(){ document.body.dataset.view = b.dataset.t; syncSwitch(); });
});
window.addEventListener('resize', fit);
syncSwitch();
</script>
